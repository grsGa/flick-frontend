# Interaction related GraphQL types

type Interaction {
  isLiked: Boolean!
  isBookmarked: Boolean!
  isReposted: Boolean!
  likeCount: Int!
  commentCount: Int!
  repostCount: Int!
}

input LikePostInput {
  postId: ID!
}

input BookmarkPostInput {
  postId: ID!
}

input RepostInput {
  postId: ID!
}
