# Interaction related GraphQL types

type Interaction {
  isLiked: Boolean!
  isBookmarked: Boolean!
  isRetweeted: Boolean!
  likeCount: Int!
  commentCount: Int!
  retweetCount: Int!
}

input LikeTweetInput {
  tweetId: ID!
}

input BookmarkTweetInput {
  tweetId: ID!
}

input RetweetInput {
  tweetId: ID!
}
