# Message related GraphQL types

type Conversation {
  id: ID!
  participants: [User!]!
  lastMessage: Message
  unreadCount: Int!
  createdAt: String!
}

type Message {
  id: ID!
  conversationId: ID!
  sender: User!
  content: String!
  media: Media
  read: Boolean!
  createdAt: String!
}

input CreateMessageInput {
  conversationId: ID!
  content: String!
  mediaId: ID
}

input CreateConversationInput {
  participantIds: [ID!]!
}

type MessageEdge {
  node: Message!
  cursor: String!
}

type MessageConnection {
  edges: [MessageEdge!]!
  pageInfo: PageInfo!
}
