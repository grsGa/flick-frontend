# User related GraphQL types

type User {
  id: ID!
  username: String!
  displayName: String
  bio: String
  location: String
  website: String
  avatarUrl: String
  bannerUrl: String
  followersCount: Int!
  followingCount: Int!
  isFollowing: Boolean
  isVerified: Boolean
  createdAt: String!
}

input UpdateProfileInput {
  displayName: String
  bio: String
  location: String
  website: String
  avatarUrl: String
  bannerUrl: String
}
